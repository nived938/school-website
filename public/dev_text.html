<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #133f47 0%, #0f2e33 100%);
        color: #fff;
        padding: 24px;
      }

      .dev-card {
        width: min(560px, 100%);
        margin: 0 auto;
        padding: clamp(24px, 5vw, 42px);
        background: #ffffff;
        color: var(--ink);
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        text-align: center;
        overflow-wrap: anywhere;
      }

      .dev-card .logo {
        display: block;
        width: 96px;
        height: 96px;
        max-width: 100%;
        object-fit: contain;
        margin: 0 auto 20px;
      }

      .dev-card h1 {
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.2;
        letter-spacing: -0.5px;
        margin: 0 0 16px;
      }

      .dev-card p {
        max-width: 430px;
        margin: 0 auto 20px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .dev-card .developer {
        margin-top: 22px;
        padding: 16px 18px;
        border: 1px solid #dce4e3;
        border-radius: 12px;
        background: #f8fbfa;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .dev-card .developer strong {
        color: var(--ink);
      }

      .dev-card .developer span {
        display: inline-block;
        margin-top: 3px;
        color: var(--teal);
        font-weight: 700;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .dev-card {
          padding: 24px 20px;
          border-radius: 16px;
        }

        .dev-card .logo {
          width: 76px;
          height: 76px;
          margin-bottom: 16px;
        }
      }

      .dev-actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="loader-content">
        <img src="images/logo.png" alt="GHSS Paravanadukkam Logo" class="loader-logo" />
        <h2>GHSS Paravanadukkam</h2>
        <p>Learn. Grow. Lead.</p>
        <div class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="background"></div>

    <div class="dev-card">
      <img src="images/logo.png" alt="School Logo" class="logo" />
      <h1>Website Under Development</h1>
      <p>
        We are preparing an updated experience for our school community.
        Please check back soon for news, galleries, admissions and contact details.
      </p>
      <div class="developer">
        Developed by <strong>GHSS Chemnad Student</strong><br />
        <span>Nived S. H</span>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
