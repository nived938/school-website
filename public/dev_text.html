<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Poppins,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:#000;
}

/* Background */

.background{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1509062522246-3755977927d");

    background-size:cover;
    background-position:center;
    filter:blur(3px);
    transform:scale(1.08);
}

/* Glass Card */

.glass-card{

    position:relative;

    width:min(90%,620px);

    padding:55px;

    text-align:center;

    border-radius:28px;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.35);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px 1px rgba(255,255,255,.35);

    color:#fff;

    animation:floatCard 7s ease-in-out infinite;
}

/* Moving Animation */

@keyframes floatCard{

0%{
transform:translate(0px,0px) rotate(0deg);
}

25%{
transform:translate(12px,-8px) rotate(.4deg);
}

50%{
transform:translate(0px,12px) rotate(0deg);
}

75%{
transform:translate(-12px,-8px) rotate(-.4deg);
}

100%{
transform:translate(0px,0px);
}

}

.logo{

    width:120px;

    margin-bottom:25px;

    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{

50%{

transform:translateY(-8px);

}

}

h1{

    font-size:2.2rem;

    margin-bottom:18px;
}

p{

    font-size:1.08rem;

    line-height:1.8;

    color:#f4f4f4;

    margin-bottom:30px;
}

.developer{

    border-top:1px solid rgba(255,255,255,.25);

    padding-top:20px;

    font-size:15px;

    color:#ffffffcc;
}

.developer span{

    color:#ffffff;

    font-weight:600;
}

/* Mobile */

@media(max-width:768px){

.glass-card{

padding:35px 25px;

}

.logo{

width:90px;

}

h1{

font-size:1.7rem;

}

p{

font-size:15px;

}

}
    </style>
  </head>
  <body>
    <div id="loader">

    	<div class="loader-content">

			<img src="images/logo.png" alt="GHSS Paravanadukkam Logo" class="loader-logo">

			<h2>GHSS Paravanadukkam</h2>

        	<p>Learn. Grow. Lead.</p>

        	<div class="loader-dots">
				<span></span>
				<span></span>
				<span></span>
        	</div>

    	</div>

	<div class="background"></div>

<div class="glass-card">

    <img src="images/logo.png" alt="School Logo" class="logo">

    <h1>Website Under Development</h1>

    <p>
        We are preparing an updated experience for our school community.
        Please check back soon for news, galleries, admissions and contact details.
    </p>

    <div class="developer">
        Developed by <strong>GHSS Chemnad Student</strong><br>
        <span>Nived S. H</span>
    </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
