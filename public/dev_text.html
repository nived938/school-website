<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:"Poppins",sans-serif;

    background:
        linear-gradient(
            rgba(5,20,40,.55),
            rgba(5,20,40,.65)
        ),
        url("images/playground.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    overflow:hidden;
}

.dev-card{
    position:relative;

    width:min(92%,620px);

    padding:45px;

    border-radius:30px;

    text-align:center;

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);

    border:1px solid rgba(255,255,255,.22);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.25);

    animation:
        floatGlass 8s ease-in-out infinite;
}

.dev-card::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.35),
            rgba(255,255,255,.03)
        );

    pointer-events:none;
}

.dev-card::after{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:32px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            transparent,
            rgba(255,255,255,.18)
        );

    z-index:-1;

    filter:blur(18px);

    opacity:.55;
}

@keyframes floatGlass{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    20%{
        transform:
            translate(8px,-8px)
            rotate(.3deg);
    }

    40%{
        transform:
            translate(-10px,-4px)
            rotate(-.4deg);
    }

    60%{
        transform:
            translate(-8px,8px)
            rotate(.4deg);
    }

    80%{
        transform:
            translate(10px,6px)
            rotate(-.3deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

}

.dev-card h1{

    color:#fff;

    font-size:48px;

    margin-bottom:20px;

    text-shadow:
        0 3px 20px rgba(0,0,0,.45);

}

.dev-card p{

    color:#eef4ff;

    font-size:18px;

    line-height:1.8;

}

.developer-credit{

    margin-top:35px;

    display:inline-block;

    padding:18px 30px;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

}

.developer-credit strong{

    color:#ffd54f;

    font-size:13px;

    letter-spacing:2px;

    text-transform:uppercase;

}

.developer-credit h3{

    color:#fff;

    margin:10px 0 5px;

}

.developer-credit p{

    color:#dbeafe;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:inherit;

    z-index:-2;

    animation:bgZoom 18s ease-in-out infinite alternate;

}

@keyframes bgZoom{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.08);

    }

}

      .dev-card {
        width: min(560px, 100%);
        background: rgba(255, 255, 255, 0.97);
        color: var(--ink);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        padding: 40px 32px;
        text-align: center;
      }

      .dev-card h1 {
        font-size: clamp(28px, 4vw, 38px);
        margin: 10px 0 16px;
      }

      .dev-card p {
        margin-bottom: 18px;
        color: var(--muted);
      }

      .dev-actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="loader">

    	<div class="loader-content">

			<img src="images/logo.png" alt="GHSS Paravanadukkam Logo" class="loader-logo">

			<h2>GHSS Paravanadukkam</h2>

        	<p>Learn. Grow. Lead.</p>

        	<div class="loader-dots">
				<span></span>
				<span></span>
				<span></span>
        	</div>

    	</div>

	</div>
    <main class="dev-card">
      <p class="eyebrow dark"><span></span> School website</p>
      <h1>Website is in development</h1>
      <p>
        We are preparing an updated experience for our school community. Please
        check back soon for news, galleries, and contact details.
      </p>
      <div class="developer-credit">
    <p>
        <strong>Website Developer</strong>
    </p>

    <h3>Nived S. H.</h3>

    <p>
        GHSS Chemnad Student
    </p>
</div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
