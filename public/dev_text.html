<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Poppins,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:#000;
}

/* Background */

.background{
    position:fixed;
    inset:0;

    background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1509062522246-3755977927d?auto=format&fit=crop&w=2000&q=80");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    animation:bgZoom 20s ease-in-out infinite alternate;
}

@keyframes bgZoom{

from{
transform:scale(1);
}

to{
transform:scale(1.08);
}

}

/* Glass Card */

.glass-card{

    position:relative;

    width:min(90%,560px);

    padding:45px;

    border-radius:28px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.28);

    backdrop-filter:blur(18px) saturate(180%);

    -webkit-backdrop-filter:blur(18px) saturate(180%);

    box-shadow:
    0 10px 35px rgba(0,0,0,.30),
    inset 0 1px 1px rgba(255,255,255,.25);

    text-align:center;

    color:white;

    animation:floatCard 7s ease-in-out infinite;

    overflow:hidden;
}

.glass-card::before{

content:"";

position:absolute;

top:0;
left:-150%;

width:80%;

height:100%;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.18),
transparent
);

transform:skewX(-25deg);

animation:glassShine 6s infinite;

}

@keyframes glassShine{

0%{
left:-150%;
}

100%{
left:170%;
}

}

/* Moving Animation */

@keyframes floatCard{

0%{
transform:translate(0px,0px) rotate(0deg);
}

25%{
transform:translate(12px,-8px) rotate(.4deg);
}

50%{
transform:translate(0px,12px) rotate(0deg);
}

75%{
transform:translate(-12px,-8px) rotate(-.4deg);
}

100%{
transform:translate(0px,0px);
}

}

.logo{

    width:120px;

    margin-bottom:25px;

    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{

50%{

transform:translateY(-8px);

}

}

h1{

    font-size:2.2rem;

    margin-bottom:18px;
}

p{

    font-size:1.08rem;

    line-height:1.8;

    color:#f4f4f4;

    margin-bottom:30px;
}

.developer{

    border-top:1px solid rgba(255,255,255,.25);

    padding-top:20px;

    font-size:15px;

    color:#ffffffcc;
}

.developer span{

    color:#ffffff;

    font-weight:600;
}

/* Mobile */

@media (max-width:768px){

.glass-card{

width:90%;

max-width:340px;

padding:25px 20px;

border-radius:22px;

}

.logo{

width:70px;

margin-bottom:15px;

}

h1{

font-size:1.5rem;

margin-bottom:12px;

}

p{

font-size:14px;

line-height:1.6;

margin-bottom:18px;

}

.developer{

font-size:13px;

padding-top:15px;

}

}
    </style>
  </head>
  <body>

        	<div class="loader-dots">
				<span></span>

    	</div>

	<div class="background"></div>

<div class="glass-card">

        We are preparing an updated experience for our school community.

    </p>

    <div class="developer">
        Developed by <strong>GHSS Chemnad Student</strong><br>

    </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
