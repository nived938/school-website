<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Under Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #133f47 0%, #0f2e33 100%);
        color: #fff;
        padding: 24px;
      }
      .dev-card {
        width: min(560px, 100%);
        background: rgba(255, 255, 255, 0.97);
        color: var(--ink);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        padding: 40px 32px;
        text-align: center;
      }

      .dev-card h1 {
        font-size: clamp(28px, 4vw, 38px);
        margin: 10px 0 16px;
      }

      .dev-card p {
        margin-bottom: 18px;
        color: var(--muted);
      }

      .dev-actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        border-radius: 999px;
      }
    </style>
</head>
  <body>
    <div id="loader">

    	<div class="loader-content">

			<img src="images/logo.png" alt="GHSS Paravanadukkam Logo" class="loader-logo">

			<h2>GHSS Paravanadukkam</h2>

        	<p>Learn. Grow. Lead.</p>

        	<div class="loader-dots">
				<span></span>
				<span></span>
				<span></span>
        	</div>

    	</div>

	</div>
    <main class="dev-card">
      <p class="eyebrow dark"><span></span> School website</p>
      <h1>Website is in development</h1>
      <p>
        We are preparing an updated experience for our school community. Please
        check back soon for news, galleries, and contact details.
      </p>
      <div class="developer-credit">
    <p>
        <strong>Website Developer</strong>
    </p>

    <h3>Nived S. H.</h3>

    <p>
        GHSS Chemnad Student
    </p>
</div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
